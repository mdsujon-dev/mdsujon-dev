<g clip-path="url(#r)">
<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#dots)"/>
<rect width="1200" height="300" fill="url(#glow)"/>
<rect width="1200" height="300" fill="url(#glow2)"/>
<g fill="none" stroke="url(#ac)" stroke-opacity="0.35">
<circle cx="1010" cy="150" r="70"/><circle cx="1010" cy="150" r="110" stroke-opacity="0.2"/><circle cx="1010" cy="150" r="150" stroke-opacity="0.1"/>
