<radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#10B981" stop-opacity="0.22"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0.6" cy="1" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.12"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
